<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome Back - Login</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #e3edf7 0%, #f4f7f6 100%);
        padding: 20px;
      }
      .login-card {
        background: #ffffff;
        width: 100%;
        max-width: 480px;
        padding: 40px 48px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        text-align: center;
      }
      .header h1 {
        font-size: 28px;
        color: #1a1a1a;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .header p {
        font-size: 14px;
        color: #666666;
        margin-bottom: 32px;
      }
      .form-group {
        text-align: left;
        margin-bottom: 20px;
        position: relative;
      }
      .form-group label {
        display: block;
        font-size: 14px;
        color: #1a1a1a;
        font-weight: 500;
        margin-bottom: 8px;
      }
      .input-container {
        position: relative;
        display: flex;
        align-items: center;
      }
      .input-container i.input-icon {
        position: absolute;
        left: 14px;
        color: #8c8c8c;
        font-size: 16px;
      }
      .input-container i.toggle-password {
        position: absolute;
        right: 14px;
        color: #1a1a1a;
        font-size: 16px;
        cursor: pointer;
      }
      .input-container input {
        width: 100%;
        padding: 14px 14px 14px 42px;
        font-size: 14px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        background-color: #f8f9fa;
        color: #1a1a1a;
        outline: none;
        transition:
          border-color 0.2s,
          background-color 0.2s;
      }
      .input-container input:focus {
        border-color: #007bff;
        background-color: #ffffff;
      }
      .input-container input::placeholder {
        color: #a0a0a0;
      }
      .login-btn {
        width: 100%;
        padding: 14px;
        background-color: #007bff;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
        box-shadow: 0 4px 12px rgba(0, 123, 255, 0.2);
        transition:
          background-color 0.2s,
          transform 0.1s;
      }
      .login-btn:hover {
        background-color: #0069d9;
      }
      .login-btn:active {
        transform: scale(0.99);
      }
      .forgot-password {
        display: inline-block;
        margin-top: 20px;
        font-size: 13px;
        color: #007bff;
        text-decoration: none;
        font-weight: 500;
      }
      .forgot-password:hover {
        text-decoration: underline;
      }
      .register-prompt {
        margin-top: 24px;
        font-size: 13px;
        color: #666666;
      }
      .register-prompt a {
        color: #007bff;
        text-decoration: none;
        font-weight: 600;
      }
      .register-prompt a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="header">
        <h1>Welcome Back</h1>
        <p>Sign in to your account</p>
      </div>

      <form>
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-container">
            <i class="fa-regular fa-user input-icon"></i>
            <input
              type="text"
              id="username"
              placeholder="Enter your username"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-container">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="password"/>
            <i class="fa-regular fa-eye toggle-password"></i>
          </div>
        </div>

        <button type="submit" class="login-btn" onclick="registerUser();
        ">
        Login
      </button>
      </form>

      <a href="#" class="forgot-password">Forgot your password?</a>

      <div class="register-prompt">
        Don't have an account? <a href="register.html">Register Now</a>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
